syntax = "proto3";

package org.apache.dubbo.samples.rest;

import "google/api/annotations.proto";

// The routes of plain HTTP are part of the IDL, as google.api.http declares
// them for gRPC transcoding.
service Greeter {
  rpc SayHello(HelloRequest) returns (HelloReply) {
    option (google.api.http) = {
      // {name} takes the field of that name; the other fields come from the query.
      get: "/v1/greetings/{name}"
      // The whole message from the JSON body.
      additional_bindings {
        post: "/v1/greetings"
        body: "*"
      }
    };
  }

  // The route of the first version, kept for the callers that still use it.
  rpc Hello(HelloRequest) returns (HelloReply) {
    option deprecated = true;
    option (google.api.http) = {get: "/v0/hello/{name}"};
  }
}

message HelloRequest {
  string name = 1;
  string greeting = 2;
}

message HelloReply {
  string message = 1;
}
